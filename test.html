<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tracker — Integration Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #0f172a; }
    h1 { font-size: 20px; }
    #results { margin-top: 20px; }
    .test { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
    .pass { background: #dcfce7; color: #166534; }
    .fail { background: #fee2e2; color: #991b1b; }
    .info { background: #f1f5f9; color: #475569; }
    #summary { font-weight: 700; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Finance Tracker — Integration Smoke Tests</h1>
  <p>Runs live CRUD + summary tests against the Supabase <code>transactions</code> table. Test rows are cleaned up automatically.</p>
  <div id="results"></div>
  <div id="summary"></div>

  <script type="module">
    import {
      addTransaction,
      listTransactions,
      updateTransaction,
      deleteTransaction,
      summarize,
      getMonthData
    } from './transactionsService.js';
    import { CATEGORY_MAP, getCategoryLabel } from './categories.js';
    import { currentMonth, todayISO, monthOf, addMonths, formatMonthLabel } from './dateUtils.js';

    const results = document.getElementById('results');
    let passed = 0, failed = 0;

    function log(name, ok, detail = '') {
      const div = document.createElement('div');
      div.className = 'test ' + (ok ? 'pass' : 'fail');
      div.textContent = (ok ? 'PASS: ' : 'FAIL: ') + name + (detail ? ' — ' + detail : '');
      results.appendChild(div);
      ok ? passed++ : failed++;
    }
    function info(msg) {
      const div = document.createElement('div');
      div.className = 'test info';
      div.textContent = msg;
      results.appendChild(div);
    }

    async function run() {
      const createdIds = [];
      const month = currentMonth();
      const date = todayISO();
      try {
        // 1. static helpers
        log('categories map has all keys', ['salary','food','rent','transport','entertainment','other'].every(k => CATEGORY_MAP[k]));
        log('dateUtils monthOf/addMonths', monthOf(date) === month && formatMonthLabel(addMonths(month, -1)).length > 0);

        // 2. add income + expense
        const inc = await addTransaction({ type: 'income', amount: 1000, category: 'salary', date, note: 'TEST_income' });
        createdIds.push(inc.id);
        log('addTransaction income returns row', inc && inc.id && Number(inc.amount) === 1000, JSON.stringify({ id: inc.id }));

        const exp = await addTransaction({ type: 'expense', amount: 40, category: 'food', date, note: 'TEST_expense' });
        createdIds.push(exp.id);
        log('addTransaction expense returns row', exp && exp.id && exp.category === 'food');

        // 3. list by month
        const list = await listTransactions({ month });
        const found = list.filter(t => createdIds.includes(t.id));
        log('listTransactions returns both test rows', found.length === 2);

        // 4. filter by category
        const foodOnly = await listTransactions({ month, category: 'food' });
        log('listTransactions category filter', foodOnly.every(t => t.category === 'food'));

        // 5. summarize
        const sum = summarize(found);
        log('summarize computes balance', sum.income === 1000 && sum.expense === 40 && sum.balance === 960);

        // 6. update
        const upd = await updateTransaction(exp.id, { amount: 75, note: 'TEST_updated' });
        log('updateTransaction applies change', Number(upd.amount) === 75 && upd.note === 'TEST_updated');

        // 7. getMonthData
        const md = await getMonthData({ month });
        log('getMonthData returns transactions + summary', Array.isArray(md.transactions) && typeof md.summary.balance === 'number');

        // 8. delete cleanup
        for (const id of createdIds) {
          const ok = await deleteTransaction(id);
          log('deleteTransaction ' + id.slice(0, 8), ok === true);
        }
        // verify gone
        const after = await listTransactions({ month });
        log('test rows removed after cleanup', !after.some(t => createdIds.includes(t.id)));
      } catch (err) {
        log('unexpected error', false, String(err && err.message || err));
        // best-effort cleanup
        for (const id of createdIds) { try { await deleteTransaction(id); } catch (_) {} }
      }

      const s = document.getElementById('summary');
      s.textContent = `Results: ${passed} passed, ${failed} failed.`;
      s.style.color = failed === 0 ? '#166534' : '#991b1b';
    }

    info('Running tests...');
    run();
  </script>
</body>
</html>
