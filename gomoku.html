<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gomoku</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px;
      background: #f5f5f7;
      color: #1a1a2e;
    }
    h1 { margin: 0; }
    #status { font-weight: 700; min-height: 1.4em; }
    #board {
      display: grid;
      gap: 2px;
      background: #ccc;
      border: 2px solid #ccc;
    }
    .cell {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }
    .cell:disabled {
      cursor: default;
    }
    #restart {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: #6c63ff;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Gomoku</h1>
  <div id="status">Current turn: X</div>
  <div id="board"></div>
  <button id="restart" type="button">Restart</button>

  <script type="module">
    import { createBoard, placeMove, checkWinner } from './gomoku.js';
    import { renderBoardHtml, nextPlayer } from './gomoku-view.js';

    const BOARD_SIZE = 15;

    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restart');

    let board = createBoard(BOARD_SIZE);
    let current = 'X';
    let winner = null;

    function render() {
      boardEl.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 28px)`;
      boardEl.innerHTML = renderBoardHtml(board);

      if (winner) {
        statusEl.textContent = `${winner} wins!`;
      } else {
        statusEl.textContent = `Current turn: ${current}`;
      }

      boardEl.querySelectorAll('.cell').forEach((btn) => {
        if (winner || btn.textContent) {
          btn.disabled = true;
        }
        btn.addEventListener('click', onCellClick);
      });
    }

    function onCellClick(e) {
      if (winner) return;
      const row = Number(e.currentTarget.dataset.row);
      const col = Number(e.currentTarget.dataset.col);

      const next = placeMove(board, row, col, current);
      if (next === board) return; // illegal move (occupied or out of bounds)
      board = next;

      const result = checkWinner(board, row, col, current);
      if (result) {
        winner = result;
      } else {
        current = nextPlayer(current);
      }

      render();
    }

    restartBtn.addEventListener('click', () => {
      board = createBoard(BOARD_SIZE);
      current = 'X';
      winner = null;
      render();
    });

    render();
  </script>
</body>
</html>
