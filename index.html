<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator">
    <h1>Tip Calculator</h1>

    <section class="field">
      <label for="bill">Bill amount</label>
      <div class="input-wrap">
        <span class="prefix">$</span>
        <input
          type="number"
          id="bill"
          inputmode="decimal"
          min="0"
          step="0.01"
          placeholder="0.00"
        >
      </div>
    </section>

    <section class="field">
      <span class="field-label">Tip</span>
      <div class="tip-buttons" role="group" aria-label="Tip percentage">
        <button type="button" class="tip-btn" data-tip="10">10%</button>
        <button type="button" class="tip-btn" data-tip="15">15%</button>
        <button type="button" class="tip-btn" data-tip="20">20%</button>
      </div>
    </section>

    <section class="field">
      <span class="field-label">Split between</span>
      <div class="counter" role="group" aria-label="Number of people">
        <button type="button" id="decrement" aria-label="Fewer people">&minus;</button>
        <output id="people" aria-live="polite">1</output>
        <button type="button" id="increment" aria-label="More people">+</button>
      </div>
    </section>

    <section class="result">
      <span class="result-label">Total per person</span>
      <output id="perPerson" class="result-amount" aria-live="polite">$0.00</output>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
