<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Reels</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="machine" id="machine">
    <header class="machine__header">
      <h1 class="machine__title">Lucky Reels</h1>
      <div class="stats">
        <div class="stat stat--credits">
          <span class="stat__label">Credits</span>
          <span class="stat__value" id="credits">1000</span>
        </div>
        <div class="stat stat--bet">
          <span class="stat__label">Bet</span>
          <span class="stat__value" id="bet">10</span>
        </div>
        <div class="stat stat--win">
          <span class="stat__label">Win</span>
          <span class="stat__value" id="win">0</span>
        </div>
      </div>
    </header>

    <section class="reels" id="reels" aria-label="Reels">
      <div class="reel" data-reel="0">
        <div class="cell" data-reel="0" data-row="0"></div>
        <div class="cell" data-reel="0" data-row="1"></div>
        <div class="cell" data-reel="0" data-row="2"></div>
      </div>
      <div class="reel" data-reel="1">
        <div class="cell" data-reel="1" data-row="0"></div>
        <div class="cell" data-reel="1" data-row="1"></div>
        <div class="cell" data-reel="1" data-row="2"></div>
      </div>
      <div class="reel" data-reel="2">
        <div class="cell" data-reel="2" data-row="0"></div>
        <div class="cell" data-reel="2" data-row="1"></div>
        <div class="cell" data-reel="2" data-row="2"></div>
      </div>
      <svg class="paylines-overlay" id="paylines-overlay" aria-hidden="true"></svg>
    </section>

    <p class="message" id="message" role="status" aria-live="polite"></p>

    <section class="controls" id="controls">
      <div class="bet-controls" role="group" aria-label="Bet amount">
        <button type="button" class="bet-btn is-active" data-bet="10">10</button>
        <button type="button" class="bet-btn" data-bet="25">25</button>
        <button type="button" class="bet-btn" data-bet="50">50</button>
        <button type="button" class="bet-btn" data-bet="100">100</button>
      </div>
      <button type="button" class="spin-btn" id="spin">SPIN</button>
      <button type="button" class="paytable-toggle" id="paytable-toggle" aria-expanded="false" aria-controls="paytable">Paytable</button>
    </section>

    <div class="out-of-credits" id="out-of-credits" hidden>
      <p>Out of credits!</p>
      <button type="button" class="reset-btn" id="reset">Reset Credits</button>
    </div>

    <aside class="paytable" id="paytable" hidden>
      <h2 class="paytable__title">Paytable</h2>
      <ul class="paytable__list" id="paytable-list"></ul>
      <p class="paytable__rtp">Declared RTP: <span id="rtp"></span></p>
    </aside>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
