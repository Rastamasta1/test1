<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guestbook</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Guestbook</h1>
      <p class="subtitle">Leave a message for everyone to see.</p>
    </header>

    <section class="card">
      <form id="guestbook-form" class="form" autocomplete="off">
        <div class="field">
          <label for="name-input">Name</label>
          <input id="name-input" name="name" type="text" placeholder="Your name" maxlength="80" required />
        </div>
        <div class="field">
          <label for="message-input">Message</label>
          <textarea id="message-input" name="message" rows="3" placeholder="Write something nice..." maxlength="500" required></textarea>
        </div>
        <div class="form-footer">
          <p id="form-status" class="status" role="status" aria-live="polite"></p>
          <button id="submit-btn" type="submit" class="btn">Sign guestbook</button>
        </div>
      </form>
    </section>

    <section class="messages-section">
      <h2 class="messages-title">Messages</h2>
      <ul id="messages-list" class="messages-list" aria-live="polite">
        <li class="empty" id="messages-empty">Loading messages...</li>
      </ul>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
