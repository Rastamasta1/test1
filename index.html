<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%234f46e5'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%F0%9F%91%8B%3C/text%3E%3C/svg%3E">
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f4f9; }
    h1 { color: #333; margin-bottom: 8px; }
    p.message { color: #555; font-size: 18px; margin-top: 0; margin-bottom: 24px; }
    button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 6px; background: #4f46e5; color: #fff; cursor: pointer; transition: background 0.2s ease; }
    button:hover { background: #4338ca; }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p class="message">Welcome to this simple hello-world web page.</p>
  <button id="greetBtn">Click Me</button>
  <script>
    function showGreeting() {
      alert('Hello, World!');
    }
    document.getElementById('greetBtn').addEventListener('click', showGreeting);
  </script>
</body>
</html>
