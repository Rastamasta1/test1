<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Rooster</title>
  <style>
    body {
      margin: 0;
      background: #f5f0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      background: #fff;
    }
    h1 {
      position: fixed;
      top: 18px;
      left: 0; right: 0;
      text-align: center;
      color: #333;
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    #downloadBtn {
      margin-top: 18px;
      padding: 10px 32px;
      font-size: 1rem;
      font-family: sans-serif;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      transition: background 0.2s;
    }
    #downloadBtn:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <h1>Black Rooster</h1>
  <canvas id="roosterCanvas" width="480" height="520"></canvas>
  <button id="downloadBtn">Download PNG</button>
  <script type="module" src="main.js"></script>
</body>
</html>
