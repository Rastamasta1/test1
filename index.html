<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinyl Record Store</title>
  <style>
    /* ── Design tokens ── */
    :root {
      --accent:       #6c63ff;
      --accent-dark:  #524bd4;
      --accent-light: #eeeeff;
      --bg:           #f5f5f7;
      --surface:      #ffffff;
      --border:       #e2e2ef;
      --text-primary: #1a1a2e;
      --text-secondary: #555577;
      --radius-sm:    8px;
      --radius-md:    14px;
      --radius-pill:  999px;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md:    0 4px 12px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.07);
      --font:         'Segoe UI', system-ui, -apple-system, sans-serif;
      --transition:   0.18s ease;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0 16px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title .logo {
      font-size: 1.4rem;
    }

    /* ── Toggle control ── */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .toggle-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: var(--radius-pill);
      transition: background var(--transition);
      cursor: pointer;
    }

    .switch-track::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition);
    }

    .switch input:checked + .switch-track {
      background: var(--accent);
    }

    .switch input:checked + .switch-track::after {
      transform: translateX(20px);
    }

    .switch input:focus-visible + .switch-track {
      outline: 3px solid rgba(108, 99, 255, 0.4);
      outline-offset: 2px;
    }

    /* ── Main content ── */
    .app-main {
      flex: 1;
      padding: 24px 16px 48px;
    }

    .content-wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .record-count {
      font-size: 0.88rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .view-mode-badge {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: var(--radius-pill);
      padding: 3px 10px;
    }

    /* ── Records grid ── */
    #records-container {
      display: grid;
      gap: 16px;
      /* single column on narrow screens (375px) */
      grid-template-columns: 1fr;
    }

    /* ── Record cards (rendered by src/render.js) ── */
    .record-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition), transform var(--transition);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .record-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .record-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .record-category {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: var(--accent-light);
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      align-self: flex-start;
    }

    .record-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .record-description {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    /* Compact mode: cards have less padding, no gap between header and card edges */
    .compact-mode .record-card {
      padding: 12px 16px;
      gap: 6px;
    }

    /* Empty state */
    .records-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* ── Loading/error states ── */
    .status-message {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* ── Responsive: 768px — 2-column grid ── */
    @media (min-width: 768px) {
      #records-container {
        grid-template-columns: repeat(2, 1fr);
      }

      .app-main {
        padding: 32px 24px 64px;
      }

      .record-name {
        font-size: 1.1rem;
      }
    }

    /* ── Responsive: 1280px — 3-column grid ── */
    @media (min-width: 1280px) {
      #records-container {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .app-main {
        padding: 40px 32px 80px;
      }

      .record-card {
        padding: 22px 24px;
      }

      .record-name {
        font-size: 1.15rem;
      }

      .record-description {
        font-size: 0.9rem;
      }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Scrollbar (Webkit) ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: var(--radius-pill);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-light); }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="header-title">
        <span class="logo" aria-hidden="true">🎵</span>
        Vinyl Record Store
      </div>

      <div class="toggle-wrap">
        <span class="toggle-label" id="toggle-label">Compact</span>
        <label class="switch" aria-label="Toggle compact view">
          <input
            type="checkbox"
            id="compact-toggle"
            role="switch"
            aria-checked="false"
            aria-labelledby="toggle-label"
          />
          <span class="switch-track"></span>
        </label>
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="content-wrap">

      <div class="status-bar">
        <span class="record-count" id="record-count">Loading&hellip;</span>
        <span class="view-mode-badge" id="view-mode-badge">Full view</span>
      </div>

      <div id="records-container" aria-live="polite" aria-label="Record list">
        <p class="status-message">Loading records&hellip;</p>
      </div>

    </div>
  </main>

  <script type="module" src="src/page.js"></script>

</body>
</html>
