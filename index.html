<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin Flip Decider</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-wrapper">
    <header>
      <h1>Coin Flip Decider</h1>
      <p class="subtitle">Let fate decide</p>
    </header>

    <main>
      <!-- Coin -->
      <div class="coin-container" aria-live="polite" aria-label="Coin animation area">
        <div class="coin" id="coin">
          <div class="coin-face coin-front">
            <span class="coin-symbol">H</span>
          </div>
          <div class="coin-face coin-back">
            <span class="coin-symbol">T</span>
          </div>
        </div>
      </div>

      <!-- Outcome label -->
      <div class="outcome-label" id="outcome-label" aria-live="polite"></div>

      <!-- Flip button -->
      <button class="btn-flip" id="btn-flip" type="button">
        Flip!
      </button>

      <!-- Custom outcome labels -->
      <section class="label-section" aria-label="Customize outcome names">
        <h2>Customize Outcomes</h2>
        <div class="label-inputs">
          <label class="label-group">
            <span>Heads label</span>
            <input
              type="text"
              id="heads-label"
              placeholder="Heads"
              maxlength="30"
              aria-label="Heads outcome label"
            />
          </label>
          <label class="label-group">
            <span>Tails label</span>
            <input
              type="text"
              id="tails-label"
              placeholder="Tails"
              maxlength="30"
              aria-label="Tails outcome label"
            />
          </label>
        </div>
      </section>

      <!-- Tally -->
      <section class="tally-section" aria-label="Session results tally">
        <h2>Session Tally</h2>
        <div class="tally-display">
          <div class="tally-item" id="tally-heads">
            <span class="tally-name" id="tally-heads-name">Heads</span>
            <span class="tally-count" id="tally-heads-count">0</span>
          </div>
          <div class="tally-divider"></div>
          <div class="tally-item" id="tally-tails">
            <span class="tally-name" id="tally-tails-name">Tails</span>
            <span class="tally-count" id="tally-tails-count">0</span>
          </div>
        </div>
        <div class="tally-total">
          Total flips: <span id="tally-total">0</span>
        </div>
        <button class="btn-reset" id="btn-reset" type="button">
          Reset Tally
        </button>
      </section>
    </main>

    <footer>
      <p>Results are session-only &mdash; refresh to start fresh</p>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
