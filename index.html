<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>&#127813; Pomodoro</h1>

  <div class="card">
    <div class="mode-switcher">
      <button class="mode-btn active" id="btn-mode-focus" type="button">Focus</button>
      <button class="mode-btn" id="btn-mode-break" type="button">Break</button>
    </div>

    <span id="mode-label">Focus Session</span>

    <div class="timer-circle">
      <div id="timer-display" role="timer" aria-live="polite" aria-label="Timer">25:00</div>
    </div>

    <div class="controls">
      <button id="btn-start-pause" type="button">Start</button>
      <button id="btn-reset" type="button">Reset</button>
    </div>

    <div class="session-info">
      <span class="tomato-icon">&#127813;</span>
      <span>Completed sessions:</span>
      <span id="session-count" aria-label="Completed sessions">0</span>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
