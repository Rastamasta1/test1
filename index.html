<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Color Palette Generator</h1>
    <p>Click generate to create 5 random colors. Click a swatch (or press Enter/Space) to copy its hex code.</p>
  </header>
  <main>
    <button id="generate-btn">Generate Palette</button>
    <div id="palette" role="list" aria-label="Generated color swatches"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden>Copied!</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
