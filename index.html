<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Diff</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Live Diff</h1>
    <div class="editors">
      <div class="editor-pane">
        <label for="left-input">Original</label>
        <textarea id="left-input" placeholder="Paste original text here…" spellcheck="false"></textarea>
      </div>
      <div class="editor-pane">
        <label for="right-input">Modified</label>
        <textarea id="right-input" placeholder="Paste modified text here…" spellcheck="false"></textarea>
      </div>
    </div>
    <section id="result-region" aria-live="polite" aria-label="Diff result">
      <p class="placeholder">Start typing in either panel to see the diff.</p>
    </section>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
