<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Pomodoro</h1>

    <p class="phase" id="phase" aria-live="polite">Work</p>

    <div class="timer" id="timer" role="timer" aria-live="polite">25:00</div>

    <div class="controls">
      <button type="button" id="start">Start</button>
      <button type="button" id="pause">Pause</button>
      <button type="button" id="reset">Reset</button>
    </div>

    <p class="sessions">
      Completed sessions: <span id="session-count">0</span>
    </p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
