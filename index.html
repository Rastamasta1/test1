<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip Splitter</title>
  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <div class="card">
    <h1>Tip Splitter</h1>

    <form id="tip-form">
      <div class="field">
        <label for="bill">Bill Total ($)</label>
        <input
          type="number"
          id="bill"
          name="bill"
          min="0"
          step="0.01"
          placeholder="0.00"
          required
        />
      </div>

      <div class="field">
        <label for="tip">Tip Percentage (%)</label>
        <select id="tip" name="tip">
          <option value="0">0%</option>
          <option value="5">5%</option>
          <option value="10">10%</option>
          <option value="15" selected>15%</option>
          <option value="18">18%</option>
          <option value="20">20%</option>
          <option value="25">25%</option>
          <option value="custom">Custom</option>
        </select>
        <input
          type="number"
          id="tip-custom"
          name="tip-custom"
          min="0"
          max="100"
          step="0.1"
          placeholder="Enter %"
          class="hidden"
        />
      </div>

      <div class="field">
        <label for="people">Number of People</label>
        <input
          type="number"
          id="people"
          name="people"
          min="1"
          step="1"
          value="1"
          required
        />
      </div>

      <button type="submit">Calculate</button>
    </form>

    <div id="result" class="result hidden" aria-live="polite">
      <div class="result-row">
        <span>Tip per person</span>
        <span id="tip-per-person">$0.00</span>
      </div>
      <div class="result-row">
        <span>Total per person</span>
        <span id="total-per-person">$0.00</span>
      </div>
      <div class="result-row total-bill">
        <span>Grand total</span>
        <span id="grand-total">$0.00</span>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
