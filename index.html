<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a3c40;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      background: #f3f9fa;
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 780px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    @media (max-width: 600px) {
      .card { grid-template-columns: 1fr; padding: 24px; }
    }

    h1 {
      grid-column: 1 / -1;
      text-align: center;
      color: #1a3c40;
      font-size: 1.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .left, .right { display: flex; flex-direction: column; gap: 28px; }

    label {
      font-size: 0.85rem;
      color: #7a9e9f;
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #c5e8e8;
      font-size: 1.1rem;
      pointer-events: none;
      font-weight: 700;
    }

    .input-wrap input {
      width: 100%;
      padding: 14px 14px 14px 36px;
      background: #e4f4f4;
      border: none;
      border-radius: 8px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a3c40;
      text-align: right;
      outline: none;
      transition: box-shadow 0.2s;
    }

    .input-wrap input:focus {
      box-shadow: 0 0 0 3px #26c0ab;
    }

    .input-wrap input::placeholder { color: #aacfcf; }

    .tip-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .tip-btn {
      background: #1a3c40;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tip-btn:hover { background: #26c0ab; color: #1a3c40; }

    .tip-btn.active {
      background: #26c0ab;
      color: #1a3c40;
    }

    .tip-custom {
      width: 100%;
      padding: 14px;
      background: #e4f4f4;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a3c40;
      text-align: center;
      outline: none;
      transition: box-shadow 0.2s;
    }

    .tip-custom::placeholder { color: #aacfcf; font-weight: 600; }
    .tip-custom:focus { box-shadow: 0 0 0 3px #26c0ab; }

    .right {
      background: #26c0ab;
      border-radius: 16px;
      padding: 32px 28px;
      justify-content: space-between;
    }

    .result-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .result-label { color: #cff5f0; }
    .result-label .main { font-size: 1rem; font-weight: 700; display: block; }
    .result-label .sub { font-size: 0.8rem; font-weight: 500; display: block; opacity: 0.8; }

    .result-value {
      font-size: 2.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }

    #per-person-total {
      font-size: 3rem;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.2);
    }

    .reset-btn {
      width: 100%;
      padding: 16px;
      background: #1a3c40;
      color: #26c0ab;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .reset-btn:hover { background: #e4f4f4; color: #1a3c40; }

    .error-msg {
      color: #ff6b6b;
      font-size: 0.8rem;
      font-weight: 600;
      min-height: 1em;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-label="Tip Calculator">
    <h1>Tip<br>Calculator</h1>

    <!-- LEFT COLUMN: Inputs -->
    <section class="left">

      <!-- Bill Amount -->
      <div>
        <label for="bill-amount">Bill Amount</label>
        <div class="input-wrap">
          <span class="icon" aria-hidden="true">$</span>
          <input
            type="number"
            id="bill-amount"
            inputmode="decimal"
            min="0"
            step="0.01"
            placeholder="0.00"
            aria-label="Bill amount in dollars"
          />
        </div>
        <p class="error-msg" id="bill-error" role="alert" aria-live="polite"></p>
      </div>

      <!-- Tip Percentage -->
      <div>
        <label>Select Tip %</label>
        <div class="tip-buttons" role="group" aria-label="Tip percentage options">
          <button class="tip-btn" data-tip="5"  type="button" aria-pressed="false">5%</button>
          <button class="tip-btn" data-tip="10" type="button" aria-pressed="false">10%</button>
          <button class="tip-btn" data-tip="15" type="button" aria-pressed="false">15%</button>
          <button class="tip-btn" data-tip="20" type="button" aria-pressed="false">20%</button>
          <button class="tip-btn" data-tip="25" type="button" aria-pressed="false">25%</button>
          <button class="tip-btn" data-tip="50" type="button" aria-pressed="false">50%</button>
        </div>
        <input
          type="number"
          id="custom-tip"
          class="tip-custom"
          inputmode="numeric"
          min="0"
          max="100"
          placeholder="Custom %"
          aria-label="Custom tip percentage"
          style="margin-top: 12px;"
        />
        <p class="error-msg" id="tip-error" role="alert" aria-live="polite"></p>
      </div>

      <!-- Number of People -->
      <div>
        <label for="people-count">Number of People</label>
        <div class="input-wrap">
          <span class="icon" aria-hidden="true">&#128100;</span>
          <input
            type="number"
            id="people-count"
            inputmode="numeric"
            min="1"
            step="1"
            placeholder="1"
            aria-label="Number of people splitting the bill"
          />
        </div>
        <p class="error-msg" id="people-error" role="alert" aria-live="polite"></p>
      </div>

    </section>

    <!-- RIGHT COLUMN: Results -->
    <section class="right" aria-label="Results">

      <div class="result-block">
        <div class="result-label">
          <span class="main">Tip Amount</span>
          <span class="sub">/ person</span>
        </div>
        <span class="result-value" id="tip-per-person" aria-live="polite">$0.00</span>
      </div>

      <hr class="divider" />

      <div class="result-block">
        <div class="result-label">
          <span class="main">Total</span>
          <span class="sub">/ person</span>
        </div>
        <span class="result-value" id="per-person-total" aria-live="polite">$0.00</span>
      </div>

      <hr class="divider" />

      <div class="result-block">
        <div class="result-label">
          <span class="main">Grand Total</span>
          <span class="sub">all people</span>
        </div>
        <span class="result-value" id="grand-total" aria-live="polite">$0.00</span>
      </div>

      <button class="reset-btn" id="reset-btn" type="button">Reset</button>

    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
