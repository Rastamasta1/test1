<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f7fa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 3rem 2.5rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.25rem;
      color: #1a1a2e;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #555;
      margin-bottom: 0.75rem;
    }

    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      background-color: #4f46e5;
      color: #fff;
      border-radius: 999px;
      padding: 0.4rem 1.2rem;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome! 👋</h1>
    <p>This is the home page of our project. We're glad you're here.</p>
    <p>Explore the content, get started, and enjoy the experience we've built for you.</p>
    <span class="badge">Getting Started</span>
  </div>
</body>
</html>
