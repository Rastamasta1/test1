<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Page</title>
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <main class="container">
    <section class="input-section">
      <div class="field">
        <label for="textarea-a">Text A</label>
        <textarea id="textarea-a" name="textarea-a" rows="8" placeholder="Enter text A here…"></textarea>
      </div>
      <div class="field">
        <label for="textarea-b">Text B</label>
        <textarea id="textarea-b" name="textarea-b" rows="8" placeholder="Enter text B here…"></textarea>
      </div>
    </section>
    <section class="result-section">
      <h2 class="result-label">Result</h2>
      <div id="result-region" class="result-region" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
