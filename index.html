<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Habit Tracker</h1>
    <p class="subtitle">Build streaks, one day at a time.</p>
  </header>

  <main>
    <section class="add-habit-section">
      <form id="add-habit-form" autocomplete="off">
        <label for="habit-name-input">New Habit</label>
        <div class="form-row">
          <input
            type="text"
            id="habit-name-input"
            name="habitName"
            placeholder="e.g. Drink 8 glasses of water"
            maxlength="80"
            required
          />
          <button type="submit">Add Habit</button>
        </div>
      </form>
    </section>

    <section class="habits-section">
      <div id="habits-container">
        <!-- Habit cards rendered by app.js -->
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
