<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Comparison</title>
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <main class="container">
    <h1>Text Comparison</h1>
    <div class="inputs">
      <div class="input-group">
        <label for="text-a">Text A</label>
        <textarea id="text-a" name="text-a" rows="10" placeholder="Enter first text here..."></textarea>
      </div>
      <div class="input-group">
        <label for="text-b">Text B</label>
        <textarea id="text-b" name="text-b" rows="10" placeholder="Enter second text here..."></textarea>
      </div>
    </div>
    <div id="result" class="result" aria-live="polite"></div>
  </main>
</body>
</html>
