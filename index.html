<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAROLINE — Expense Tracker</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">CAROLINE</h1>
      <p class="app-subtitle">Personal Expense Tracker</p>
    </header>

    <nav class="tab-nav" id="tab-nav">
      <button class="tab-btn is-active" type="button" data-view="add-view" id="tab-add">Add</button>
      <button class="tab-btn" type="button" data-view="summary-view" id="tab-summary">Summary</button>
    </nav>

    <main class="views">
      <section id="add-view" class="view is-active" aria-labelledby="tab-add">
        <form id="expense-form" class="expense-form" novalidate>
          <div class="form-field">
            <label for="expense-amount">Amount (USD)</label>
            <input
              type="number"
              id="expense-amount"
              name="amount"
              placeholder="0.00"
              step="0.01"
              min="0.01"
              inputmode="decimal"
              required
            >
            <span class="field-error" id="expense-amount-error" aria-live="polite"></span>
          </div>

          <div class="form-field">
            <label for="expense-category">Category</label>
            <select id="expense-category" name="category" required>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="home">Home</option>
              <option value="fun">Fun</option>
              <option value="other">Other</option>
            </select>
            <span class="field-error" id="expense-category-error" aria-live="polite"></span>
          </div>

          <div class="form-field">
            <label for="expense-date">Date</label>
            <input type="date" id="expense-date" name="date" required>
            <span class="field-error" id="expense-date-error" aria-live="polite"></span>
          </div>

          <div class="form-field">
            <label for="expense-note">Note (optional)</label>
            <input type="text" id="expense-note" name="note" placeholder="e.g. Groceries" maxlength="140">
          </div>

          <button type="submit" class="btn-primary" id="expense-submit">Add Expense</button>
        </form>

        <ul id="expense-list" class="expense-list" aria-live="polite">
          <!-- Sprint 1: rendered expense rows with delete buttons go here -->
        </ul>
      </section>

      <section id="summary-view" class="view" aria-labelledby="tab-summary">
        <div class="summary-controls">
          <label for="summary-month-select">Month</label>
          <select id="summary-month-select" aria-label="Select month"></select>
        </div>

        <div id="summary-bars" class="summary-bars" aria-live="polite">
          <!-- Sprint 2: per-category horizontal bars rendered here by src/summaryView.js -->
        </div>

        <div class="summary-total-row">
          <span class="summary-total-label">Grand Total</span>
          <span id="summary-grand-total" class="summary-total-amount">$0.00</span>
        </div>

        <div class="summary-actions">
          <button type="button" id="summary-clear-btn" class="btn-danger">Clear all data</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
