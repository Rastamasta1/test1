<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks · Personal Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div>
        <h1>My Tasks</h1>
        <p class="subtitle">Stay on top of what matters.</p>
      </div>
    </header>

    <div id="form-mount"></div>

    <section class="card mt-4">
      <div class="toolbar">
        <div class="tabs" id="tabs">
          <button type="button" class="tab active" data-view="active">Active</button>
          <button type="button" class="tab" data-view="completed">Completed</button>
        </div>
        <div id="filter-mount"></div>
      </div>
      <div id="active-list"></div>
      <div id="completed-list" class="hidden"></div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
